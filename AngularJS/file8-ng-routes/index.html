<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo for custom filter</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular-route.js"></script>
  </head>
  <body ng-app="myApp">
    <p><a href="#/">India Tourism</a></p>
    <a href="#/agra">Taj Mahal</a>
    <a href="#/kashmir">Kashmir</a>
    <a href="#/goa">Goa</a>
    <p>Click on the links to read about London and Paris.</p>
    <div ng-view="" style="background-color: lightblue"></div>

    <script>
      var app = angular.module("myApp", ["ngRoute"]);
      app.config(function ($routeProvider) {
        $routeProvider
          .when("/", {
            templateUrl: "indiaTourism.html",
          })
          .when("/agra", {
            templateUrl: "agra.html",
          })
          .when("/kashmir", {
            templateUrl: "kashmir.html",
          })
          .when("/goa", {
            templateUrl: "goa.html",
          })
          .otherwise({
            redirectTo: "/",
          });
      });
    </script>
    <p>Make your own filters.</p>
    <p>
      This filter, called "myName", will capitalize every second character of a
      given name!
    </p>
  </body>
</html>
